<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<title>PS4 GoldHen &mdash; Offline cache</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="host">

<video id="bgVideo" class="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="media/wallpaper.jpg">
    <source src="media/wallpaper.mp4" type="video/mp4">
</video>
<div class="bg-veil" aria-hidden="true"></div>

<main class="stage">
    <div class="panel">
        <header class="brand">
            <span class="kicker">PlayStation 4</span>
            <h1 class="word">GoldHen</h1>
            <p class="tagline">Offline cache &middot; firmware 11.50 - 14.02</p>
        </header>

        <div class="fw-chip">
            <span class="dot"></span>
            <span>Setup</span>
            <strong>keep this page open</strong>
        </div>

        <div id="msgs" class="status">Starting&hellip;</div>
        <div class="bar-wrap" id="barWrap"><div class="bar" id="bar"></div></div>
        <p id="tapHint" class="hint" hidden>Tap the screen to start the wallpaper.</p>
        <p class="hint">Cache installs automatically, then the host opens.</p>

        <button type="button" class="reload" id="reloadBtn">Reload</button>
    </div>

    <footer class="credits">PS4 GoldHen <span class="sep">&middot;</span> by Abdellah <span class="sep">&middot;</span> @klamust</footer>
</main>

<script src="cache.js"></script>
</body>
</html>
