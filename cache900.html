<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>PS4 GoldHen &mdash; Offline cache</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<video id="bgVideo" class="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="media/poster.jpg">
    <source src="media/background.mp4" type="video/mp4">
</video>
<div class="bg-veil" aria-hidden="true"></div>

<main class="shell">
    <header class="brand">
        <span class="kicker">PlayStation 4</span>
        <h1 class="word">GoldHen</h1>
        <p class="tagline">Offline cache &middot; firmware 9.00 &ndash; 9.60</p>
    </header>

    <div class="fw-chip">
        <span class="dot"></span>
        <span>Setup</span>
        <strong>keep this page open</strong>
    </div>

    <section class="card">
        <div id="msgs" class="status">Starting&hellip;</div>
        <div class="bar-wrap" id="barWrap" hidden><div class="bar" id="bar"></div></div>
        <div class="actions">
            <button type="button" class="btn btn-gold" id="continue" hidden>Continue</button>
            <button type="button" class="btn" id="bgBtn" hidden>Resume wallpaper</button>
        </div>
        <p class="preview-body" style="margin-top:16px">When it finishes, close the browser and reopen it. The console can then run GoldHEN without internet.</p>
    </section>

    <footer class="credits">
        <span class="mark">PS4 GoldHen</span>
        <span class="sep">&middot;</span>
        <span>by Abdellah</span>
        <span class="sep">&middot;</span>
        <span>@klamust</span>
    </footer>
</main>

<script src="cache.js"></script>
</body>
</html>
