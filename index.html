<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<title>PS4 GoldHen</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="host">

<video id="bgVideo" class="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="media/poster.jpg">
    <source src="media/background.mp4" type="video/mp4">
</video>
<div class="bg-veil" aria-hidden="true"></div>

<main class="stage">
    <div class="panel">
        <header class="brand">
            <span class="kicker">PlayStation 4</span>
            <h1 class="word">GoldHen</h1>
            <p class="tagline">Exploit host &middot; 5.05 &ndash; 14.02</p>
        </header>

        <div class="fw-chip">
            <span class="dot"></span>
            <span>Firmware</span>
            <strong id="fwValue">detecting&hellip;</strong>
        </div>

        <div id="msgs" class="status">Preparing&hellip;</div>
        <div class="bar-wrap" id="barWrap" hidden><div class="bar" id="bar"></div></div>
        <p id="tapHint" class="hint" hidden>Tap the screen to start the wallpaper.</p>
        <p id="preview" class="hint" hidden>Open this page in the PS4 web browser. On the first visit the offline cache installs, then it runs without internet.</p>

        <button type="button" class="reload" id="reloadBtn">Reload</button>
    </div>

    <footer class="credits">PS4 GoldHen <span class="sep">&middot;</span> by Abdellah <span class="sep">&middot;</span> @klamust</footer>
</main>

<script>
(function () {
    "use strict";

    var msgs = document.getElementById("msgs");
    var fwEl = document.getElementById("fwValue");
    var barWrap = document.getElementById("barWrap");
    var bar = document.getElementById("bar");
    var barTimer = null;
    var vid = document.getElementById("bgVideo");
    var tapHint = document.getElementById("tapHint");
    var preview = document.getElementById("preview");
    var reload = document.getElementById("reloadBtn");

    var ua = navigator.userAgent || "";
    var match = ua.match(/PlayStation 4[ \/]([\d.]+)/i);
    var isPS4 = match !== null;
    var fw = isPS4 ? match[1] : "Unknown";
    var fwNum = parseFloat(fw);

    function say(html) {
        if (msgs) msgs.innerHTML = html;
    }

    function showProgress() {
        if (!barWrap) return;
        barWrap.hidden = false;
        var p = 0;
        if (bar) bar.style.width = "0%";
        say("Starting&hellip;");
        barTimer = setInterval(function () {
            p += Math.max(1, Math.round((92 - p) / 14));
            if (p > 92) p = 92;
            if (bar) bar.style.width = p + "%";
        }, 180);
    }

    function stopProgress() {
        if (barTimer) { clearInterval(barTimer); barTimer = null; }
    }

    function startVideo() {
        if (!vid) return;
        try {
            vid.muted = true;
            vid.loop = true;
        } catch (e) {}
        var p = null;
        try { p = vid.play(); } catch (e) {}
        if (p && p.then) {
            p.then(function () {
                if (tapHint) tapHint.hidden = true;
            }).catch(function () {
                if (tapHint) tapHint.hidden = false;
            });
        }
    }

    if (vid) {
        vid.addEventListener("ended", function () {
            try { vid.currentTime = 0; vid.play(); } catch (e) {}
        }, false);
        vid.addEventListener("playing", function () {
            if (tapHint) tapHint.hidden = true;
        }, false);
        vid.addEventListener("canplay", startVideo, false);
        vid.addEventListener("error", function () {
            try { vid.style.display = "none"; } catch (e) {}
        }, false);

        startVideo();
        setTimeout(function () {
            if (vid && vid.paused && tapHint) tapHint.hidden = false;
        }, 2200);

        var kick = function () {
            startVideo();
            document.removeEventListener("click", kick, false);
            document.removeEventListener("touchstart", kick, false);
            document.removeEventListener("keydown", kick, false);
        };
        document.addEventListener("click", kick, false);
        document.addEventListener("touchstart", kick, false);
        document.addEventListener("keydown", kick, false);
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden) startVideo();
        }, false);
    }

    if (reload) {
        reload.addEventListener("click", function () {
            location.reload();
        }, false);
    }

    function addScript(src, isModule, onload) {
        var s = document.createElement("script");
        if (isModule) s.type = "module";
        s.src = src;
        s.onerror = function () {
            stopProgress();
            say('Content not found &mdash; clear the browser data and re-install the cache.');
        };
        if (onload) s.onload = onload;
        document.head.appendChild(s);
    }

    function runExploit() {
        showProgress();

        if (fwNum === 5.05 || fwNum === 5.07) {
            addScript("fw505/exploit.js");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            addScript("700/alert.js", true);
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            addScript("900/alert.js", true);
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            addScript("css/main.js", false, function () {
                setTimeout(function () {
                    if (typeof window.doJb === "function") window.doJb();
                }, 500);
            });
        } else if (fwNum === 11.50 || fwNum === 11.52) {
            addScript("slopkit/chain_lapse.js", true);
        } else if (fwNum >= 12.00 && fwNum <= 14.02) {
            addScript("slopkit/jb.js", true);
        } else {
            stopProgress();
            say('Unsupported firmware: <span class="bad">' + fw + "</span>");
        }
    }

    function route() {
        if (!isPS4) {
            if (fwEl) fwEl.textContent = "not a PS4";
            say("Open this host on a PlayStation 4.");
            if (preview) preview.hidden = false;
            return;
        }

        if (fwEl) fwEl.textContent = fw;
        var appCache = window.applicationCache;

        if (!appCache || appCache.status === 0) {
            say("Installing offline cache&hellip;");
            if (fwNum === 5.05 || fwNum === 5.07) {
                location.replace("cache505.html");
            } else if (fwNum >= 7.00 && fwNum <= 8.52) {
                location.replace("cache700.html");
            } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                location.replace("cache900.html");
            } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                location.replace("cachecss.html");
            } else if (fwNum >= 11.50 && fwNum <= 14.02) {
                location.replace("cacheslopkit.html");
            } else {
                say('Unsupported firmware: <span class="bad">' + fw + "</span>");
            }
            return;
        }

        say("Loading GoldHEN v2.4b18.14&hellip; Please wait");
        runExploit();
    }

    route();
})();
</script>
</body>
</html>
